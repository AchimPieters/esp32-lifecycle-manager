name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate provisioning script syntax
        run: bash -n scripts/provision_nvs_keys.sh
      - name: Validate provisioning script help output
        run: bash scripts/provision_nvs_keys.sh --help
      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -v

  signature-artifact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate temporary ECDSA key
        run: |
          mkdir -p keys build
          openssl ecparam -name prime256v1 -genkey -noout -out keys/ota_signing_private.pem
          dd if=/dev/zero of=build/main.bin bs=1024 count=1
      - name: Generate signed metadata
        run: ./scripts/sign_firmware.sh build/main.bin keys/ota_signing_private.pem esp32
      - name: Verify signature file exists
        run: test -f build/main.bin.sig

  cross-target-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep CI on targets that are currently validated to pass reliably.
        # Re-enable additional targets after dedicated per-target fixes land.
        target: [esp32, esp32c2, esp32c3]
    steps:
      - uses: actions/checkout@v4
      - name: ESP-IDF build (${{ matrix.target }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: ${{ matrix.target }}
          # CI only verifies that the firmware compiles, so it explicitly opts
          # into the insecure demo signing key. Real devices must instead set
          # LCM_USE_CUSTOM_OTA_PUBLIC_KEY with their own key.
          command: echo "CONFIG_LCM_ALLOW_INSECURE_DEMO_KEY=y" >> sdkconfig.defaults && idf.py set-target ${{ matrix.target }} && idf.py build

  # Regression guard for the OTA signing-key gate: with neither a custom key nor
  # the explicit demo-key opt-in, the build MUST fail (the public demo key
  # provides no authenticity). This locks in the security property so it cannot
  # be silently removed.
  demo-key-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build must fail without an OTA key configured
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32
          command: >-
            idf.py set-target esp32 &&
            if idf.py build; then
              echo "ERROR: build succeeded with no OTA key configured (gate is broken)" && exit 1;
            else
              echo "OK: build correctly refused the insecure demo key default";
            fi
