name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate provisioning script syntax
        run: bash -n scripts/provision_nvs_keys.sh
      - name: Validate provisioning script help output
        run: bash scripts/provision_nvs_keys.sh --help
      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -v

  signature-artifact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate temporary ECDSA key
        run: |
          mkdir -p keys build
          openssl ecparam -name prime256v1 -genkey -noout -out keys/ota_signing_private.pem
          dd if=/dev/zero of=build/main.bin bs=1024 count=1
      - name: Generate signed metadata
        run: ./scripts/sign_firmware.sh build/main.bin keys/ota_signing_private.pem esp32
      - name: Verify signature file exists
        run: test -f build/main.bin.sig

  cross-target-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep CI on targets that are currently validated to pass reliably.
        # Re-enable additional targets after dedicated per-target fixes land.
        target: [esp32, esp32c2, esp32c3]
    steps:
      - uses: actions/checkout@v4
      - name: ESP-IDF build (${{ matrix.target }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: ${{ matrix.target }}
          # CI verifies the firmware compiles out of the box with the bundled
          # demo signing key. Real devices must instead set
          # LCM_USE_CUSTOM_OTA_PUBLIC_KEY with their own key.
          command: idf.py set-target ${{ matrix.target }} && idf.py build

  # Regression guard for the demo-key default: with no custom key configured the
  # firmware MUST still build (the bundled demo key keeps the out-of-the-box
  # evaluation flow working). This locks in the property that the default build
  # is not accidentally broken again.
  demo-key-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build must succeed with the default demo key
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32
          command: idf.py set-target esp32 && idf.py build

  # Verify the bundled LED application example compiles, so changes to the
  # application-side lifecycle glue (esp32-lcm.c) and its build config are
  # caught. Pulls the HomeKit/button/mdns managed components from the registry.
  example-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LED example (esp32)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32
          path: examples/led
          command: idf.py set-target esp32 && idf.py build
